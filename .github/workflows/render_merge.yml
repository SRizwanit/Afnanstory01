# render_merge.yml (Step 39b, universal) - manual GitHub Action: render ANY number of parts (2 or more), then merge them into ONE MP4.
# Trigger : workflow_dispatch only (Actions -> "Render and merge" -> Run workflow, from the GitHub mobile website).
# Inputs  : parts (comma list, e.g. "horror1,horror2,horror3" - the order is the play order), orientation, quality,
#           mode (video|draft), render_order (sequential|parallel), sync_mode, intro_mode, outro_mode, join (cut|crossfade),
#           xfade_seconds, output_name (optional), publish_release.
# Jobs    : prepare (validate + unpack update.zip + preflight for EVERY part + build the render matrix)
#           -> render  (one runner per part x output; by default ONE AT A TIME in the order of `parts`: horror1, then horror2, then ...;
#                       retries; every single part video is kept as an artifact)
#           -> merge   (one runner per output: ffprobe checks, ffmpeg join of all parts, duration check)
#           -> release (optional) -> summary (table in the job summary, runs even after failures).
# Output  : artifacts "pNN-<part>-<label>" (each single part, 14 days; NN = position 01, 02, ...),
#           "merged-<slug>-<label>" (the final merged MP4, 30 days), optional Release "merge-<slug>-<run>".
#           Merged file name: <slug>-<label>.mp4 ; label = vertical-hd, horizontal-4k, vertical-draft ...
#           slug = the part names joined by "-" (up to 4 parts), otherwise "<first>-to-<last>-<count>parts"; output_name overrides it.
# Needs   : package.json, index.js, Root.jsx, Story.jsx, theme.js, build_data.py, <part>.wav, <part>.json for EVERY part
#           (make_ambience.py is optional). Repo stays flat: out/ and dl/ exist only on the runners.
# Limits  : 2 - 40 parts; parts x outputs must be <= 256 (GitHub matrix limit). Part names: letters, digits, _ and - only, all different.
# Time    : no timeout-minutes is set on any job (no self-imposed time limit). GitHub itself still stops a single job at
#           360 minutes (6 h); every video renders on its own runner, so one job only has to render ONE part of ONE output.
# Order   : render_order=sequential (default) -> max-parallel 1: the runners start one after another in the order of `parts`
#           (all outputs of part 1, then all of part 2, ...). render_order=parallel -> all at once (faster, same result).
#           The merge always joins the parts in the order written in `parts`, whatever the render order was.
# Joining : join=cut        -> ffmpeg concat, video is stream-copied (no re-encode, lossless, fast; only the small audio
#                              track is re-encoded so there is no click at the joins). If the streams differ or the result length
#                              is wrong, it automatically falls back to a re-encode concat.
#           join=crossfade  -> re-encode with a video cross-dissolve + audio cross-fade of xfade_seconds (0.1 - 3) at EVERY join.
# Defaults: intro_mode=first_only -> only the first part keeps its intro; outro_mode=last_only -> only the last part keeps its
#           outro. So the merged video has ONE intro (start) and ONE outro (end). Other values: all | none.
# Notes   : GITHUB_TOKEN may not change workflow files, so update.zip is unpacked with -x ".github/*";
#           to change THIS file, paste it by hand in the GitHub mobile website (.github/workflows/render_merge.yml).
#           Text inputs are passed through env vars, never pasted into shell code.
#           All parts get the same render options (orientation, quality, sync) - the workflow guarantees it.
name: Render and merge

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "Parts in play order, comma separated (2 or more), e.g. horror1,horror2,horror3 (each uses <part>.wav and <part>.json)"
        type: string
        default: "horror1,horror2"
      orientation:
        description: "Which orientation"
        type: choice
        options: [both, vertical, horizontal]
        default: both
      quality:
        description: "hd = 1080p, 4k = 2x (video mode only; draft is always small)"
        type: choice
        options: [hd, 4k, both]
        default: hd
      mode:
        description: "video = final quality, draft = small+fast preview (debug HUD on) - use draft to test the merge first"
        type: choice
        options: [video, draft]
        default: draft
      render_order:
        description: "sequential = one render at a time in the order of parts | parallel = all at once (faster)"
        type: choice
        options: [sequential, parallel]
        default: sequential
      sync_mode:
        description: "Caption sync for all parts: keep | fit | offset:-0.2"
        type: string
        default: "keep"
      intro_mode:
        description: "Which parts keep their intro (60 frames): first_only | all | none"
        type: choice
        options: [first_only, all, none]
        default: first_only
      outro_mode:
        description: "Which parts keep their outro (90 frames): last_only | all | none"
        type: choice
        options: [last_only, all, none]
        default: last_only
      join:
        description: "cut = plain join (lossless) | crossfade = soft dissolve between the parts (re-encodes)"
        type: choice
        options: [cut, crossfade]
        default: cut
      xfade_seconds:
        description: "Crossfade length in seconds (only for join=crossfade; 0.1 - 3)"
        type: string
        default: "0.5"
      output_name:
        description: "Optional name of the merged file (letters, digits, _ and -); blank = automatic from the part names"
        type: string
        default: ""
      publish_release:
        description: "Also attach the merged files to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-merge-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  FORCE_COLOR: "0"

jobs:
  # ------------------------------------------------------------------ 1) prepare
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mmatrix: ${{ steps.plan.outputs.mmatrix }}
      labels: ${{ steps.plan.outputs.labels }}
      parts: ${{ steps.plan.outputs.parts }}
      slug: ${{ steps.plan.outputs.slug }}
      maxpar: ${{ steps.plan.outputs.maxpar }}
    env:
      PARTS: ${{ inputs.parts }}
      SYNC: ${{ inputs.sync_mode }}
      ORIENTATION: ${{ inputs.orientation }}
      QUALITY: ${{ inputs.quality }}
      MODE: ${{ inputs.mode }}
      ORDER: ${{ inputs.render_order }}
      INTRO_MODE: ${{ inputs.intro_mode }}
      OUTRO_MODE: ${{ inputs.outro_mode }}
      JOIN: ${{ inputs.join }}
      XFADE: ${{ inputs.xfade_seconds }}
      OUTPUT_NAME: ${{ inputs.output_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          e = os.environ
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          parts = [p.strip() for p in e["PARTS"].split(",") if p.strip()]
          if len(parts) < 2:
              fail("parts needs at least 2 names separated by commas, e.g. horror1,horror2")
          if len(parts) > 40:
              fail(f"too many parts ({len(parts)}); the limit is 40")
          for p in parts:
              if not re.fullmatch(r"[A-Za-z0-9_-]+", p):
                  fail(f"part names may only contain letters, digits, _ and - (got: {p})")
          dup = sorted({p for p in parts if parts.count(p) > 1})
          if dup:
              fail("every part may appear only once (repeated: " + ", ".join(dup) + ")")
          if not re.fullmatch(r"keep|fit|offset:-?[0-9]+(\.[0-9]+)?", e["SYNC"]):
              fail("sync_mode must be keep, fit or offset:-0.2")
          if e["OUTPUT_NAME"] and not re.fullmatch(r"[A-Za-z0-9_-]{1,60}", e["OUTPUT_NAME"]):
              fail("output_name may only contain letters, digits, _ and - (max 60 characters)")
          if e["JOIN"] == "crossfade":
              try:
                  v = float(e["XFADE"])
              except ValueError:
                  fail("xfade_seconds must be a number like 0.5")
              if not 0.1 <= v <= 3:
                  fail("xfade_seconds must be between 0.1 and 3")
          print(f"Inputs OK: {len(parts)} parts = {', '.join(parts)} | mode={e['MODE']} orientation={e['ORIENTATION']} "
                f"quality={e['QUALITY']} order={e['ORDER']} sync={e['SYNC']} join={e['JOIN']} "
                f"intro={e['INTRO_MODE']} outro={e['OUTRO_MODE']}")
          PY

      - name: Unpack update.zip (if present)
        run: |
          set -euo pipefail
          if [ -f update.zip ]; then
            echo "update.zip found - unpacking (workflow files excluded)"
            unzip -o -q update.zip -x ".github/*"
            rm -f update.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes after unpack."
            else
              git commit -m "Unpack update.zip (merge run ${{ github.run_number }})"
              git push origin HEAD
            fi
          else
            echo "No update.zip - using files already in the repo."
          fi

      - name: Preflight - required files exist (every part)
        run: |
          set -euo pipefail
          missing=0
          for f in package.json index.js Root.jsx Story.jsx theme.js build_data.py; do
            if [ -f "$f" ]; then echo "ok       $f"; else echo "::error::missing file: $f (upload it with update.zip)"; missing=1; fi
          done
          IFS=',' read -ra LIST <<< "$PARTS"
          for raw in "${LIST[@]}"; do
            p="$(echo "$raw" | tr -d '[:space:]')"
            [ -n "$p" ] || continue
            for f in "$p.wav" "$p.json"; do
              if [ -f "$f" ]; then echo "ok       $f"; else echo "::error::missing file: $f (upload it with update.zip)"; missing=1; fi
            done
          done
          [ -f make_ambience.py ] && echo "ok       make_ambience.py" || echo "::notice::make_ambience.py not found - ambience step will be skipped"
          [ "$missing" -eq 0 ] || exit 1

      - name: Plan render matrix
        id: plan
        run: |
          python3 - <<'PY'
          import json, os, sys
          e = os.environ
          parts = [p.strip() for p in e["PARTS"].split(",") if p.strip()]
          n = len(parts)
          orient, quality, mode = e["ORIENTATION"], e["QUALITY"], e["MODE"]
          orients = ["vertical", "horizontal"] if orient == "both" else [orient]
          comps = {"vertical": "Vertical", "horizontal": "Horizontal"}
          outputs = []
          for o in orients:
              if mode == "video":
                  qs = ["hd", "4k"] if quality == "both" else [quality]
                  for q in qs:
                      outputs.append({"label": f"{o}-{q}", "comp": comps[o], "scale": "2" if q == "4k" else "1",
                                      "kind": "video", "debug": "false", "crf": "18", "preset": "medium"})
              else:
                  outputs.append({"label": f"{o}-draft", "comp": comps[o], "scale": "0.5",
                                  "kind": "draft", "debug": "true", "crf": "28", "preset": "ultrafast"})
          items = []
          for i, p in enumerate(parts):
              intro = e["INTRO_MODE"] == "all" or (e["INTRO_MODE"] == "first_only" and i == 0)
              outro = e["OUTRO_MODE"] == "all" or (e["OUTRO_MODE"] == "last_only" and i == n - 1)
              for out in outputs:
                  it = dict(out)
                  it.update({"part": p, "idx": f"{i + 1:02d}",
                             "intro": "true" if intro else "false", "outro": "true" if outro else "false"})
                  items.append(it)
          if len(items) > 256:
              print(f"::error::{len(items)} renders requested ({n} parts x {len(outputs)} outputs); GitHub allows at most 256 per matrix")
              sys.exit(1)
          if e["OUTPUT_NAME"]:
              slug = e["OUTPUT_NAME"]
          elif n <= 4:
              slug = "-".join(parts)
          else:
              slug = f"{parts[0]}-to-{parts[-1]}-{n}parts"
          matrix = json.dumps({"include": items}, ensure_ascii=False, separators=(",", ":"))
          mmatrix = json.dumps({"include": [{"label": o["label"], "crf": o["crf"], "preset": o["preset"]} for o in outputs]},
                               separators=(",", ":"))
          labels = ",".join(o["label"] for o in outputs)
          maxpar = "1" if e["ORDER"] == "sequential" else "256"
          print("parts :", parts)
          print("labels:", labels)
          print("slug  :", slug)
          print("renders:", len(items), "| max parallel:", maxpar)
          for it in items:
              print(f"  {it['idx']} {it['part']:<20} {it['label']:<18} intro={it['intro']} outro={it['outro']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={matrix}\n")
              fh.write(f"mmatrix={mmatrix}\n")
              fh.write(f"labels={labels}\n")
              fh.write(f"parts={','.join(parts)}\n")
              fh.write(f"slug={slug}\n")
              fh.write(f"maxpar={maxpar}\n")
          PY

  # ------------------------------------------------------------------ 2) render every part (one runner per part x output)
  render:
    name: render ${{ matrix.idx }} ${{ matrix.part }} ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.maxpar) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PART: ${{ matrix.part }}
      SYNC: ${{ inputs.sync_mode }}
      INTRO: ${{ matrix.intro }}
      OUTRO: ${{ matrix.outro }}
      LABEL: ${{ matrix.label }}
      COMP: ${{ matrix.comp }}
      SCALE: ${{ matrix.scale }}
      KIND: ${{ matrix.kind }}
      DEBUG: ${{ matrix.debug }}
      IDX: ${{ matrix.idx }}
    steps:
      # ref = branch name, so the files pushed by the "prepare" job (unpacked update.zip) are included
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build data and audio (Python)
        run: |
          set -euo pipefail
          INTRO_F=60; [ "$INTRO" = "true" ] || INTRO_F=0
          OUTRO_F=90; [ "$OUTRO" = "true" ] || OUTRO_F=0
          echo "::group::build_data.py (part=$PART intro=$INTRO_F outro=$OUTRO_F sync=$SYNC)"
          python build_data.py --part "$PART" --sync "$SYNC" --intro "$INTRO_F" --outro "$OUTRO_F"
          echo "::endgroup::"
          if [ -f make_ambience.py ]; then
            echo "::group::make_ambience.py"
            python -m pip install --quiet numpy || true
            python make_ambience.py --part "$PART"
            echo "::endgroup::"
          else
            echo "make_ambience.py does not exist yet - skipped"
          fi
          # fixed name used by Story v2 (Step 34)
          cp "$PART.wav" narration.wav

      - name: Install Chrome Headless Shell libraries (Ubuntu 24.04)
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y \
                libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev \
                libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 \
                libpango-1.0-0 libatk-bridge2.0-0; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed - retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::apt install failed after 3 attempts"
          exit 1

      - name: npm install + Chrome (3 attempts)
        run: |
          set -uo pipefail
          retry() {
            local n=1 max=3 delay=15 rc
            until "$@"; do
              rc=$?
              if [ "$n" -ge "$max" ]; then echo "::error::failed after $n attempts: $*"; return "$rc"; fi
              echo "::warning::attempt $n failed (exit $rc) - retrying in ${delay}s: $*"
              sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
            done
          }
          retry npm install --no-audit --no-fund || exit 1
          retry npx remotion browser ensure || exit 1

      - name: Render this part
        run: |
          set -uo pipefail
          mkdir -p out
          START=$SECONDS

          # props are built with json.dumps, so Bengali text and quotes are always escaped correctly
          PROPS=$(python3 - <<'PY'
          import json, os
          e = os.environ
          p = {"part": e["PART"], "debug": e["DEBUG"] == "true",
               "intro": e["INTRO"] == "true", "outro": e["OUTRO"] == "true"}
          print(json.dumps(p, ensure_ascii=False, separators=(",", ":")))
          PY
          )
          echo "position: $IDX   part: $PART   composition: $COMP   kind: $KIND   scale: $SCALE"
          echo "props: $PROPS"

          retry() {
            local n=1 max=3 delay=20 rc
            until "$@"; do
              rc=$?
              if [ "$n" -ge "$max" ]; then echo "::error::render failed after $n attempts: $COMP ($PART $LABEL)"; return "$rc"; fi
              echo "::warning::render attempt $n failed (exit $rc) - retrying in ${delay}s"
              [ -n "${RETRY_CLEAN:-}" ] && rm -f "$RETRY_CLEAN"
              sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
            done
          }

          case "$KIND" in
            video)
              echo "::group::remotion render $COMP -> $PART-$LABEL.mp4"
              RETRY_CLEAN="out/$PART-$LABEL.mp4" retry npx remotion render index.js "$COMP" "out/$PART-$LABEL.mp4" \
                --scale="$SCALE" --crf=18 --codec=h264 --pixel-format=yuv420p \
                --concurrency=2 --props="$PROPS" || exit 1
              echo "::endgroup::"
              ;;
            draft)
              echo "::group::remotion render (draft) $COMP -> $PART-$LABEL.mp4"
              RETRY_CLEAN="out/$PART-$LABEL.mp4" retry npx remotion render index.js "$COMP" "out/$PART-$LABEL.mp4" \
                --scale="$SCALE" --crf=28 --x264-preset=ultrafast --codec=h264 --pixel-format=yuv420p \
                --concurrency=2 --props="$PROPS" || exit 1
              echo "::endgroup::"
              ;;
            *)
              echo "::error::unknown kind $KIND"; exit 1
              ;;
          esac

          ELAPSED=$((SECONDS - START))
          echo "::group::output files"
          ls -lh out
          echo "::endgroup::"
          {
            echo "### Part $IDX \`$PART\` - \`$LABEL\` ($COMP, scale $SCALE, intro $INTRO, outro $OUTRO) - ${ELAPSED}s"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: p${{ matrix.idx }}-${{ matrix.part }}-${{ matrix.label }}
          path: out/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  # ------------------------------------------------------------------ 3) merge all parts -> one MP4 (one runner per output)
  merge:
    name: merge ${{ matrix.label }}
    needs: [prepare, render]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.mmatrix) }}
    env:
      PARTS_CSV: ${{ needs.prepare.outputs.parts }}
      SLUG: ${{ needs.prepare.outputs.slug }}
      LABEL: ${{ matrix.label }}
      CRF: ${{ matrix.crf }}
      PRESET: ${{ matrix.preset }}
      JOIN: ${{ inputs.join }}
      XFADE: ${{ inputs.xfade_seconds }}
    steps:
      # every artifact "pNN-<part>-<label>" of this output lands in dl/<artifact name>/
      - uses: actions/download-artifact@v4
        with:
          pattern: p*-${{ matrix.label }}
          path: dl

      - name: Make sure ffmpeg is installed
        run: |
          set -uo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y ffmpeg; then exit 0; fi
            echo "::warning::apt attempt $attempt failed - retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::could not install ffmpeg"
          exit 1

      - name: Merge all parts
        run: |
          set -uo pipefail
          mkdir -p out
          OUT="out/${SLUG}-${LABEL}.mp4"
          START=$SECONDS
          IFS=',' read -ra PARTS <<< "$PARTS_CSV"
          N=${#PARTS[@]}

          vsig() { ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of csv=p=0 "$1"; }
          asig() { ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$1"; }
          dur()  { ffprobe -v error -show_entries format=duration -of csv=p=0 "$1"; }

          # collect the inputs in play order and inspect them
          FILES=(); DURS=(); INPUTS=()
          VREF=""; AREF=""; SAME=1
          i=0
          for p in "${PARTS[@]}"; do
            i=$((i + 1))
            f="dl/p$(printf '%02d' "$i")-${p}-${LABEL}/${p}-${LABEL}.mp4"
            [ -s "$f" ] || { echo "::error::missing or empty input video for part $i ($p): $f"; ls -R dl; exit 1; }
            v=$(vsig "$f"); a=$(asig "$f"); d=$(dur "$f")
            echo "part $i $p: video=$v audio=$a duration=${d}s"
            [ -n "$a" ] || { echo "::error::part $i ($p) has no audio stream"; exit 1; }
            if [ -z "$VREF" ]; then VREF="$v"; AREF="$a"; fi
            if [ "$(echo "$v" | cut -d, -f2,3,4)" != "$(echo "$VREF" | cut -d, -f2,3,4)" ]; then
              echo "::error::part $i ($p) has a different size or frame rate: '$v' vs '$VREF'"; exit 1
            fi
            { [ "$v" = "$VREF" ] && [ "$a" = "$AREF" ]; } || SAME=0
            FILES+=("$f"); DURS+=("$d"); INPUTS+=(-i "$f")
          done
          SUM=$(python3 -c "import sys; print(round(sum(float(x) for x in sys.argv[1:]), 3))" "${DURS[@]}")

          ENC=(-c:v libx264 -crf "$CRF" -preset "$PRESET" -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart)

          # builds the ffmpeg filter graph for N inputs: mode concat | xfade
          graph() {
            python3 - "$1" "$XFADE" "${DURS[@]}" <<'PY'
          import sys
          mode, xd = sys.argv[1], float(sys.argv[2])
          durs = [float(x) for x in sys.argv[3:]]
          n = len(durs)
          g = []
          for k in range(n):
              g.append(f"[{k}:v]setsar=1[v{k}]")
              g.append(f"[{k}:a]aresample=48000[a{k}]")
          if mode == "concat":
              g.append("".join(f"[v{k}][a{k}]" for k in range(n)) + f"concat=n={n}:v=1:a=1[v][a]")
          else:
              length = durs[0]
              prev_v, prev_a = "v0", "a0"
              for k in range(1, n):
                  last = k == n - 1
                  out_v, out_a = ("v", "a") if last else (f"x{k}", f"c{k}")
                  g.append(f"[{prev_v}][v{k}]xfade=transition=fade:duration={xd}:offset={round(length - xd, 3)}[{out_v}]")
                  g.append(f"[{prev_a}][a{k}]acrossfade=d={xd}[{out_a}]")
                  length = length + durs[k] - xd
                  prev_v, prev_a = out_v, out_a
          print(";".join(g))
          PY
          }

          reencode_concat() {
            echo "re-encode concat (filter) of $N parts"
            ffmpeg -y -hide_banner -loglevel warning "${INPUTS[@]}" -filter_complex "$(graph concat)" \
              -map "[v]" -map "[a]" "${ENC[@]}" "$OUT"
          }

          METHOD=""
          if [ "$JOIN" = "crossfade" ]; then
            for d in "${DURS[@]}"; do
              python3 -c "import sys; sys.exit(0 if float('$d') > 2 * float('$XFADE') else 1)" \
                || { echo "::error::a part ($d s) is too short for a ${XFADE}s crossfade (needs more than twice that)"; exit 1; }
            done
            echo "crossfade ${XFADE}s at each of the $((N - 1)) joins"
            if ffmpeg -y -hide_banner -loglevel warning "${INPUTS[@]}" -filter_complex "$(graph xfade)" \
                -map "[v]" -map "[a]" "${ENC[@]}" "$OUT"; then
              METHOD="crossfade (re-encode, ${XFADE}s)"
              EXPECT=$(python3 -c "print(round(float('$SUM') - ($N - 1) * float('$XFADE'), 3))")
            else
              echo "::warning::crossfade failed - falling back to a plain re-encoded cut"
              rm -f "$OUT"
              reencode_concat || { echo "::error::ffmpeg failed"; exit 1; }
              METHOD="cut (re-encode fallback after crossfade failure)"
              EXPECT="$SUM"
            fi
          else
            EXPECT="$SUM"
            if [ "$SAME" = "1" ]; then
              : > list.txt
              for f in "${FILES[@]}"; do printf "file '%s'\n" "$PWD/$f" >> list.txt; done
              echo "stream-copy concat (same codecs): video copied, only the small audio track is re-encoded to avoid a click at the joins"
              if ffmpeg -y -hide_banner -loglevel warning -f concat -safe 0 -i list.txt -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart "$OUT"; then
                GOT=$(dur "$OUT")
                if python3 -c "import sys; sys.exit(0 if abs(float('$GOT') - float('$EXPECT')) <= 0.35 + 0.05 * $N else 1)"; then
                  METHOD="cut (video stream copy - lossless, audio re-encoded)"
                else
                  echo "::warning::copy result is ${GOT}s but ${EXPECT}s was expected - re-encoding instead"
                fi
              else
                echo "::warning::stream-copy concat failed - re-encoding instead"
              fi
              rm -f list.txt
            else
              echo "::notice::stream parameters differ between parts - re-encoding"
            fi
            if [ -z "$METHOD" ]; then
              rm -f "$OUT"
              reencode_concat || { echo "::error::ffmpeg failed"; exit 1; }
              METHOD="cut (re-encode)"
            fi
          fi

          # final check: file exists, has video + audio, length is right
          [ -s "$OUT" ] || { echo "::error::merged file is missing or empty"; exit 1; }
          GOT=$(dur "$OUT"); VF=$(vsig "$OUT"); AF=$(asig "$OUT")
          echo "merged: video=$VF audio=$AF duration=${GOT}s (expected ~${EXPECT}s) via $METHOD"
          [ -n "$AF" ] || { echo "::error::merged file has no audio"; exit 1; }
          python3 -c "import sys; sys.exit(0 if abs(float('$GOT') - float('$EXPECT')) <= 0.5 + 0.05 * $N else 1)" \
            || { echo "::error::merged length ${GOT}s does not match the expected ${EXPECT}s"; exit 1; }

          ELAPSED=$((SECONDS - START))
          ls -lh out
          {
            echo "### Merge \`$LABEL\` - ${N} parts - ${ELAPSED}s"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Method | $METHOD |"
            i=0
            for p in "${PARTS[@]}"; do i=$((i + 1)); echo "| Part $i (\`$p\`) | ${DURS[$((i - 1))]}s |"; done
            echo "| Merged | ${GOT}s |"
            echo "| File | \`$(basename "$OUT")\` ($(du -h "$OUT" | cut -f1)) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: merged-${{ needs.prepare.outputs.slug }}-${{ matrix.label }}
          path: out/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  # ------------------------------------------------------------------ 4) optional GitHub Release (merged files only)
  release:
    needs: [prepare, merge]
    if: ${{ inputs.publish_release && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.rel.outputs.url }}
    env:
      PARTS_CSV: ${{ needs.prepare.outputs.parts }}
      MODE: ${{ inputs.mode }}
      JOIN: ${{ inputs.join }}
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: merged-*
          path: out
          merge-multiple: true

      - name: Write release notes
        run: |
          set -euo pipefail
          {
            echo "Automated merge of \`${PARTS_CSV//,/\` + \`}\` (mode \`$MODE\`, join \`$JOIN\`, run #$RUN)."
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
          } > release_notes.md
          cat release_notes.md

      - uses: softprops/action-gh-release@v2
        id: rel
        with:
          tag_name: merge-${{ needs.prepare.outputs.slug }}-${{ github.run_number }}
          name: ${{ needs.prepare.outputs.slug }} ${{ inputs.mode }} #${{ github.run_number }}
          target_commitish: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ inputs.mode == 'draft' }}
          files: out/*

  # ------------------------------------------------------------------ 5) summary (runs even if something failed)
  summary:
    needs: [prepare, render, merge, release]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PARTS_CSV: ${{ needs.prepare.outputs.parts }}
      SLUG: ${{ needs.prepare.outputs.slug }}
      LABELS: ${{ needs.prepare.outputs.labels }}
      MODE: ${{ inputs.mode }}
      ORDER: ${{ inputs.render_order }}
      ORIENTATION: ${{ inputs.orientation }}
      QUALITY: ${{ inputs.quality }}
      SYNC: ${{ inputs.sync_mode }}
      JOIN: ${{ inputs.join }}
      XFADE: ${{ inputs.xfade_seconds }}
      INTRO_MODE: ${{ inputs.intro_mode }}
      OUTRO_MODE: ${{ inputs.outro_mode }}
      RENDER_RESULT: ${{ needs.render.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      RELEASE_URL: ${{ needs.release.outputs.url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dl

      - name: Job summary table
        run: |
          python3 - <<'PY'
          import os
          e = os.environ
          parts = [p for p in e["PARTS_CSV"].split(",") if p]
          labels = [x for x in e.get("LABELS", "").split(",") if x]
          slug = e["SLUG"]

          def size_of(name):
              d = os.path.join("dl", name)
              files = sorted(os.listdir(d)) if os.path.isdir(d) else []
              return (len(files), sum(os.path.getsize(os.path.join(d, f)) for f in files))

          rows, ok_merged, missing_parts = [], 0, []
          for lb in labels:
              have = 0
              for i, p in enumerate(parts, 1):
                  if size_of(f"p{i:02d}-{p}-{lb}")[0]:
                      have += 1
                  else:
                      missing_parts.append(f"{p} ({lb})")
              n, size = size_of(f"merged-{slug}-{lb}")
              if n:
                  ok_merged += 1
                  merged = f"OK ({size / 1048576:.1f} MB)"
              else:
                  merged = "MISSING"
              rows.append(f"| `{lb}` | {have}/{len(parts)} | {merged} |")
          out = []
          out.append(f"## Render and merge summary - `{slug}`")
          out.append("")
          out.append(f"- Parts in order ({len(parts)}): " + " -> ".join(f"`{p}`" for p in parts))
          out.append(f"- Mode: **{e['MODE']}** | order: {e['ORDER']} | orientation: {e['ORIENTATION']} | quality: {e['QUALITY']} | sync: `{e['SYNC']}`")
          xf = f" ({e['XFADE']} s)" if e["JOIN"] == "crossfade" else ""
          out.append(f"- Join: **{e['JOIN']}**{xf} | intro: {e['INTRO_MODE']} | outro: {e['OUTRO_MODE']}")
          out.append(f"- Render job: **{e['RENDER_RESULT']}** | merge job: **{e['MERGE_RESULT']}** | merged outputs ready: **{ok_merged}/{len(labels)}**")
          if e.get("RELEASE_RESULT") and e["RELEASE_RESULT"] != "skipped":
              url = e.get("RELEASE_URL", "")
              out.append(f"- Release: **{e['RELEASE_RESULT']}**" + (f" - {url}" if url else ""))
          out.append(f"- Download the files from the **Artifacts** section at the bottom of this run page: {e['RUN_URL']}")
          out.append(f"- The final file is the artifact `merged-{slug}-<label>` (file `{slug}-<label>.mp4`); every single part is the artifact `pNN-<part>-<label>`.")
          out.append("")
          out.append("| Output | Parts rendered | Merged |")
          out.append("|---|---|---|")
          out.extend(rows)
          out.append("")
          if missing_parts:
              out.append("> Not rendered (render failed or was skipped): " + ", ".join(missing_parts)
                         + ". The merge was skipped. Open the failed render job, copy the red error lines and send them to the AI (one file will be fixed).")
          elif ok_merged < len(labels):
              out.append("> All parts rendered, but a merged cell says MISSING: open that merge job, copy the red error lines and send them to the AI.")
          text = "\n".join(out) + "\n"
          print(text)
          with open(e["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          PY
